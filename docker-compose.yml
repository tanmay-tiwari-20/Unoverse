# Local full-stack services for smoke-testing the deploy path: backend + Redis.
# The Compose backend is intentionally a DEVELOPMENT service: production rejects
# wildcard CORS, while this local stack is meant to accept the separately-run
# frontend on localhost. Run the frontend separately with
# `cd frontend && npm run dev` pointed at http://localhost:3001.
#
#   docker compose up --build
#
# Then open the frontend and create/join a room. Stop with Ctrl+C.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Published so the backend can also be run on the HOST (`npm run dev`)
    # against this container. Bound to 127.0.0.1 on purpose: this Redis has no
    # password, so it must never be reachable from the LAN. The `backend`
    # service below does not use this mapping — it reaches Redis over the
    # compose network as `redis:6379`.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: development
      LOG_LEVEL: debug
      # Use Redis for both durable room state and cross-instance broadcasts.
      STORE: redis
      REDIS_URL: redis://redis:6379
      # The local frontend runs on port 3000. Add another explicit origin here
      # when using a different local preview host; production must use the exact
      # deployed frontend origin(s), never "*".
      CORS_ORIGIN: http://localhost:3000
      TURN_TIMEOUT_MS: "45000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
