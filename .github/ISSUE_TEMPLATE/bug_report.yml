name: Bug report
description: Report a reproducible problem in Unoverse
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Unoverse. Please do not include passwords,
        Redis URLs, TURN credentials, profile secrets, or private player data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence of actions.
      placeholder: |
        1. Start the backend with ...
        2. Create or join a room ...
        3. ...
    validations:
      required: true
  - type: input
    id: checks
    attributes:
      label: Command or route that failed
      description: For example, `npm test`, `npm run build`, or `/health`.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Node version, and whether Docker/Redis was used.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs or a test failure. Remove secrets first.
      render: text
